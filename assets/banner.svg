<svg width="100%" height="220" viewBox="0 0 850 220" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Background Gradient -->
    <linearGradient id="bgGrad" x1="0" y1="0" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#07090e"/>
      <stop offset="45%" stop-color="#0d1117"/>
      <stop offset="100%" stop-color="#161b22"/>
    </linearGradient>

    <!-- Glowing Accent Gradient -->
    <linearGradient id="accentGrad" x1="0" y1="0" x2="850" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#bc8cff" stop-opacity="0.8"/>
      <stop offset="70%" stop-color="#3fb950" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#58a6ff" stop-opacity="0.9"/>
    </linearGradient>

    <!-- Wave Gradient -->
    <linearGradient id="waveGrad" x1="0" y1="120" x2="850" y2="220" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#58a6ff" stop-opacity="0.12"/>
      <stop offset="50%" stop-color="#bc8cff" stop-opacity="0.16"/>
      <stop offset="100%" stop-color="#1f6feb" stop-opacity="0.08"/>
    </linearGradient>

    <!-- Subtle Dot Grid Pattern -->
    <pattern id="dotPattern" x="0" y="0" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1" fill="#30363d" fill-opacity="0.45"/>
    </pattern>

    <!-- Glow Filter -->
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="8" result="blur" />
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Container Box with Rounded Borders -->
  <rect width="850" height="220" rx="16" fill="url(#bgGrad)" stroke="#30363d" stroke-width="1.2"/>

  <!-- Dot Grid Overlay -->
  <rect width="850" height="220" rx="16" fill="url(#dotPattern)"/>

  <!-- Modern Ambient Wave Curves -->
  <path d="M0,160 C200,120 350,200 550,150 C700,110 780,180 850,145 L850,220 L0,220 Z" fill="url(#waveGrad)"/>
  <path d="M0,180 C180,150 320,210 520,175 C680,145 760,195 850,170 L850,220 L0,220 Z" fill="#58a6ff" fill-opacity="0.05"/>

  <!-- Top Accent Highlight Bar -->
  <rect x="0" y="0" width="850" height="3" rx="1.5" fill="url(#accentGrad)"/>

  <!-- Terminal Style Status Pill (Top Left) -->
  <g transform="translate(42, 32)">
    <rect width="138" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <circle cx="14" cy="12" r="4" fill="#3fb950">
      <animate attributeName="opacity" values="1;0.4;1" dur="2s" repeatCount="indefinite"/>
    </circle>
    <text x="26" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5">OPEN TO WORK</text>
  </g>

  <!-- Systems / Tag Pill (Top Right) -->
  <g transform="translate(670, 32)">
    <rect width="138" height="24" rx="12" fill="#161b22" stroke="#30363d" stroke-width="1"/>
    <text x="69" y="16" fill="#8b949e" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="11" font-weight="600" letter-spacing="0.5" text-anchor="middle">UPNYK // INFORMATIKA</text>
  </g>

  <!-- Main Name Title -->
  <text x="425" y="112" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', Roboto, sans-serif" font-size="36" font-weight="800" fill="#ffffff" letter-spacing="-0.5">
    Muhammad Athalla Bagaskara
  </text>

  <!-- Subtitle with Glowing Accent Badges -->
  <text x="425" y="148" text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', 'Fira Code', monospace" font-size="15" font-weight="500" fill="#58a6ff" letter-spacing="1.2">
    FRONTEND &amp; SYSTEMS ENGINEER <tspan fill="#8b949e">•</tspan> alDev
  </text>

  <!-- Tech Highlights Strip -->
  <g transform="translate(425, 185)">
    <text text-anchor="middle" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="12" font-weight="500" fill="#8b949e" letter-spacing="0.5">
      React 18 &amp; Strict TypeScript <tspan fill="#30363d">|</tspan> Python Cloud Automation <tspan fill="#30363d">|</tspan> Real-Time Telemetry
    </text>
  </g>
</svg>
